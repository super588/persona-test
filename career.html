<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测你适合打工还是创业</title>
<style>
:root{
  --bg:#e9edf5;
  --ink:#16233b;
  --gold:#ff6b35;
  --gold2:#ff8c5a;
  --card:#fff;
  --muted:#78859b;
  --line:#e3e8f1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 8%, rgba(255,107,53,.08), transparent 42%),
                   radial-gradient(circle at 88% 92%, rgba(22,35,59,.06), transparent 46%);
}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;}
.screen.active{display:flex;}
.wrap{width:100%;max-width:520px;margin:0 auto;}

/* 门禁屏 */
.gate-card{background:var(--card);border-radius:24px;padding:40px 30px;box-shadow:0 18px 50px rgba(22,35,59,.10);text-align:center;}
.gate-card .logo{font-size:13px;letter-spacing:2px;color:var(--muted);margin-bottom:14px;}
.gate-card h1{font-size:30px;font-weight:800;letter-spacing:1px;margin-bottom:10px;}
.gate-card .sub{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:24px;}
.gate-input{width:100%;padding:15px 18px;font-size:20px;letter-spacing:8px;text-align:center;border:2px solid var(--line);border-radius:14px;outline:none;color:var(--ink);}
.gate-input:focus{border-color:var(--gold);}
.gate-err{color:#e0522f;font-size:13px;margin-top:10px;min-height:18px;}
.btn{display:block;width:100%;padding:16px;font-size:17px;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:transform .12s,opacity .12s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;margin-top:18px;box-shadow:0 10px 26px rgba(255,107,53,.30);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);margin-top:10px;}
.rule-note{font-size:11px;color:#a8b3c4;margin-top:16px;line-height:1.6;}

/* 性别屏 */
.gender-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:8px;}
.gender-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;}
.gender-list{display:flex;flex-direction:column;gap:14px;}
.gender-item{background:var(--card);border-radius:16px;padding:20px;text-align:center;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(22,35,59,.06);cursor:pointer;border:2px solid transparent;transition:border-color .12s;}
.gender-item:active{border-color:var(--gold);}

/* 答题屏 */
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.quiz-progress{font-size:13px;color:var(--muted);font-weight:600;}
.progress-bar{width:100%;height:8px;background:#dfe5ef;border-radius:6px;overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .25s;}
.q-card{background:var(--card);border-radius:24px;padding:30px 26px;box-shadow:0 18px 50px rgba(22,35,59,.08);}
.q-text{font-size:20px;font-weight:800;line-height:1.6;margin-bottom:22px;}
.q-option{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px;cursor:pointer;transition:border-color .12s,background .12s;}
.q-option .opt-tag{flex:0 0 26px;height:26px;border-radius:50%;background:#eef1f7;color:var(--ink);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.q-option .opt-txt{font-size:16px;line-height:1.6;padding-top:2px;}
.q-option.sel{border-color:var(--gold);background:rgba(255,107,53,.06);}
.q-option.sel .opt-tag{background:var(--gold);color:#fff;}
.quiz-nav{display:flex;gap:12px;margin-top:20px;}
.quiz-nav .btn{flex:1;margin-top:0;}
.btn-prev{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
.btn-next{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 10px 26px rgba(255,107,53,.28);}

/* 结果屏 */
.result-head{text-align:center;margin-bottom:18px;}
.result-head .brand{font-size:13px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
.result-head .type-name{font-size:40px;font-weight:900;letter-spacing:2px;margin-bottom:6px;}
.result-head .type-tag{font-size:16px;font-style:italic;color:var(--gold);font-weight:600;margin-bottom:14px;}
.keywords{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.kw{display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:700;color:var(--gold);background:rgba(255,107,53,.10);border:1px solid rgba(255,107,53,.35);}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.result-actions .btn{margin-top:0;}
#resultCanvas{width:100%;max-width:520px;border-radius:20px;box-shadow:0 20px 50px rgba(22,35,59,.16);}
.footer-brand{margin-top:20px;text-align:center;font-size:12px;color:#a8b3c4;letter-spacing:1px;}
</style>
</head>
<body>

<!-- 门禁屏 -->
<div class="screen active" id="screen-gate">
  <div class="wrap">
    <div class="gate-card">
      <div class="logo">玄策观人 · 小红书号 4950383218</div>
      <h1>测你适合打工还是创业</h1>
      <div class="sub">不是问你敢不敢辞职，<br>是问你适合用哪种方式赚钱。</div>
      <input class="gate-input" id="gateInput" placeholder="输入访问码" maxlength="6" inputmode="numeric">
      <div class="gate-err" id="gateErr"></div>
      <button class="btn btn-primary" id="btnEnter">开始测试</button>
      <div class="rule-note">非职业测评 · 非预测 · 结果仅供娱乐</div>
    </div>
  </div>
</div>

<!-- 性别屏 -->
<div class="screen" id="screen-gender">
  <div class="wrap">
    <div class="gender-title">先选一下你的性别</div>
    <div class="gender-sub">报告的语气会有一点不同</div>
    <div class="gender-list">
      <div class="gender-item" data-g="f">女生</div>
      <div class="gender-item" data-g="m">男生</div>
      <div class="gender-item" data-g="x">都可以</div>
    </div>
  </div>
</div>

<!-- 答题屏 -->
<div class="screen" id="screen-quiz">
  <div class="wrap">
    <div class="quiz-top">
      <span class="quiz-progress" id="qCount"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="qProgress"></div></div>
    <div class="q-card">
      <div class="q-text" id="qText"></div>
      <div id="qOptions"></div>
      <div class="quiz-nav">
        <button class="btn btn-prev" id="btnPrev">上一题</button>
        <button class="btn btn-next" id="btnNext">下一题</button>
      </div>
    </div>
  </div>
</div>

<!-- 结果屏 -->
<div class="screen" id="screen-result">
  <div class="wrap">
    <div class="result-head" id="resultHead"></div>
    <canvas id="resultCanvas" width="750" height="1200"></canvas>
    <div class="result-actions">
      <button class="btn btn-primary" id="btnSave">保存结果图</button>
      <button class="btn btn-ghost" id="btnRestart">再测一次</button>
      <button class="btn btn-ghost" id="btnBack">换一组</button>
    </div>
    <div class="footer-brand">玄策观人 · 小红书号 4950383218</div>
  </div>
</div>

/* ============ 引擎 ============ */
const dims = CONFIG.dims;
const dimCount = dims.length;
const TAG = ['A','B','C','D'];
const TIER_NAME = ['低','中','高'];
const ENT_IDX = [0,1,2,3,5,7];  // 创业倾向：风险+自主+反馈+结构+延迟+成就
const IND_IDX = [1,6];          // 独立倾向：自主+独立

let curQ = 0;
let answers = new Array(CONFIG.questions.length);
let userRaw = new Array(dimCount).fill(0);

// 理论最高分：每维度在每题的最高加分之和
const theoryMax = new Array(dimCount).fill(0);
CONFIG.questions.forEach(q => {
  const perDim = new Array(dimCount).fill(0);
  q.opts.forEach(o => o.adds.forEach(a => { perDim[a[0]] = Math.max(perDim[a[0]], a[1]); }));
  for (let i = 0; i < dimCount; i++) theoryMax[i] += perDim[i];
});

function $(id){ return document.getElementById(id); }
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function scoreRate(){
  return dims.map((_, i) => Math.round((userRaw[i] / (theoryMax[i] || 1)) * 100));
}
function tier(rate){ return rate >= 70 ? 2 : (rate >= 40 ? 1 : 0); }

$('btnEnter').addEventListener('click', enterTest);
$('gateInput').addEventListener('keydown', e => { if(e.key === 'Enter') enterTest(); });
function enterTest(){
  const v = $('gateInput').value.trim();
  if(v === CONFIG.accessCode){
    $('gateErr').textContent = '';
    show('screen-gender');
  } else {
    $('gateErr').textContent = '访问码不对，再试试';
  }
}

document.querySelectorAll('.gender-item').forEach(el => {
  el.addEventListener('click', () => setGender(el.dataset.g));
});
function setGender(g){
  gender = g;
  curQ = 0;
  answers = new Array(CONFIG.questions.length);
  userRaw = new Array(dimCount).fill(0);
  renderQuestion();
  show('screen-quiz');
}

/* 答题 */
function renderQuestion(){
  const q = CONFIG.questions[curQ];
  $('qCount').textContent = (curQ + 1) + ' / ' + CONFIG.questions.length;
  $('qProgress').style.width = ((curQ + 1) / CONFIG.questions.length * 100) + '%';
  $('qText').textContent = q.t;
  const box = $('qOptions');
  box.innerHTML = '';
  q.opts.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'q-option' + (answers[curQ] === i ? ' sel' : '');
    div.innerHTML = '<span class="opt-tag">' + TAG[i] + '</span><span class="opt-txt">' + o.a + '</span>';
    div.addEventListener('click', () => selectOption(i));
    box.appendChild(div);
  });
  $('btnPrev').style.visibility = curQ === 0 ? 'hidden' : 'visible';
  $('btnNext').textContent = curQ === CONFIG.questions.length - 1 ? '看结果' : '下一题';
}
function selectOption(i){
  const q = CONFIG.questions[curQ];
  const prev = answers[curQ];
  if(prev !== undefined){ q.opts[prev].adds.forEach(a => { userRaw[a[0]] -= a[1]; }); }
  answers[curQ] = i;
  q.opts[i].adds.forEach(a => { userRaw[a[0]] += a[1]; });
  renderQuestion();
}
$('btnNext').addEventListener('click', () => {
  if(answers[curQ] === undefined){ return; }
  if(curQ < CONFIG.questions.length - 1){ curQ++; renderQuestion(); }
  else { computeResult(); }
});
$('btnPrev').addEventListener('click', () => {
  if(curQ > 0){ curQ--; renderQuestion(); }
});

/* 结果 */
function computeResult(){
  if(answers.some(a => a === undefined)){ return; }
  const rates = scoreRate();
  const ent = ENT_IDX.reduce((s, i) => s + rates[i], 0) / ENT_IDX.length;
  const ind = IND_IDX.reduce((s, i) => s + rates[i], 0) / IND_IDX.length;
  let key;
  if(ent >= 55 && ind >= 55) key = '单干型';
  else if(ent >= 55 && ind < 55) key = '合伙型';
  else if(ent < 55 && ind >= 55) key = '杠杆型';
  else key = '稳岗型';
  const type = CONFIG.types[key];
  renderResult(type, rates);
}

function renderResult(type, rates){
  $('resultHead').innerHTML =
    '<div class="brand">你的主类型是</div>' +
    '<div class="type-name">' + type.name + '</div>' +
    '<div class="type-tag">' + type.tagline + '</div>' +
    '<div class="keywords">' + type.keywords.map(k => '<span class="kw">' + k + '</span>').join('') + '</div>';
  show('screen-result');
  requestAnimationFrame(() => drawCard(type, rates));
}

/* canvas 绘制 */
function wrapLines(text, font, maxW){
  const ctx = $('resultCanvas').getContext('2d');
  ctx.font = font;
  const lines = [];
  let cur = '';
  for(const ch of text){
    const test = cur + ch;
    if(ctx.measureText(test).width > maxW && cur !== ''){
      lines.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if(cur !== '') lines.push(cur);
  return lines;
}
function measure(text, font, maxW){
  return wrapLines(text, font, maxW);
}

function drawRadar(ctx, cx, cy, r, userVec, figVec){
  const n = dimCount;
  const angle = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, rr) => [cx + Math.cos(angle(i)) * rr, cy + Math.sin(angle(i)) * rr];
  // 环
  ctx.strokeStyle = 'rgba(255,140,90,.25)';
  ctx.lineWidth = 1;
  for(let k = 1; k <= 4; k++){
    ctx.beginPath();
    for(let i = 0; i < n; i++){
      const [x, y] = pt(i, r * k / 4);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  // 轴线 + 标签
  ctx.fillStyle = '#c7d3e4';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i = 0; i < n; i++){
    const [x1, y1] = pt(i, 0);
    const [x2, y2] = pt(i, r);
    ctx.strokeStyle = 'rgba(255,140,90,.35)';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const [lx, ly] = pt(i, r + 20);
    ctx.fillText(dims[i], lx, ly);
  }
  // 类型虚线
  if(figVec){
    ctx.strokeStyle = '#ff8c5a';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    figVec.forEach((v, i) => {
      const [x, y] = pt(i, r * v / 100);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // 用户实线
  if(userVec){
    ctx.beginPath();
    userVec.forEach((v, i) => {
      const [x, y] = pt(i, r * v / 100);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,140,90,.35)';
    ctx.fill();
    ctx.strokeStyle = '#ff8c5a';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawSec(ctx, ty, title, lines){
  ctx.font = '800 27px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ff8c5a';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, 48, ty);
  ty += 42;
  ctx.font = '21px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  for(const l of lines){
    ctx.fillText(l, 48, ty);
    ty += 33;
  }
  return ty + 18;
}

function drawCard(type, rates){
  const canvas = $('resultCanvas');
  const ctx = canvas.getContext('2d');
  const W = 750;
  const padX = 48;
  const bodyFont = '21px "PingFang SC","Microsoft YaHei",sans-serif';
  const bodyMaxW = W - padX * 2;

  // 构建 6 部分报告
  const secs = [];
  // 1 一句话总评
  secs.push(['「 你适合的赚钱结构 」', measure(type.summary, bodyFont, bodyMaxW)]);
  // 2 主类型描述
  secs.push(['「 你的主类型 」', measure(type.desc, bodyFont, bodyMaxW)]);
  // 2.5 你可能没意识到的一面（被看见反差）
  secs.push(['「 你可能没意识到的一面 」', measure(type.hidden, bodyFont, bodyMaxW)]);
  // 2.6 你的隐藏天赋（正向赋能）
  secs.push(['「 你的隐藏天赋 」', measure(type.talent, bodyFont, bodyMaxW)]);
  // 3 8维度逐条解读
  const dimLines = [];
  rates.forEach((r, i) => {
    const t = tier(r);
    const d = CONFIG.dimTiers[dims[i]][t];
    const full = dims[i] + '【' + TIER_NAME[t] + '】倾向：' + d.tend + '。这意味着：' + d.mean;
    measure('· ' + full, bodyFont, bodyMaxW).forEach(l => dimLines.push(l));
    dimLines.push('');
  });
  secs.push(['「 8 个维度，逐条看透你 」', dimLines]);
  // 4 短板提醒（得分最低维度）
  let lowestIdx = 0;
  rates.forEach((r, i) => { if(r < rates[lowestIdx]) lowestIdx = i; });
  const weakKey = dims[lowestIdx];
  const w = CONFIG.weakReminders[weakKey];
  const weakLines = [];
  measure('· ' + w.scene, bodyFont, bodyMaxW).forEach(l => weakLines.push(l));
  weakLines.push('');
  w.practice.forEach(p => { measure('· ' + p, bodyFont, bodyMaxW).forEach(l => weakLines.push(l)); });
  secs.push(['「 你现在最该补的：' + weakKey + ' 」', weakLines]);
  // 5 适合的赚钱结构
  const careerLines = [];
  type.careers.forEach(c => {
    measure('· ' + c.c + ' —— ' + c.r, bodyFont, bodyMaxW).forEach(l => careerLines.push(l));
  });
  secs.push(['「 适合你的赚钱结构 」', careerLines]);
  // 6 一个提醒
  secs.push(['「 一个提醒 」', measure(type.remind, bodyFont, bodyMaxW)]);

  // 计算高度
  const titleH = 60;
  const nameH = 72;
  const tagH = 40;
  const kwH = 60;
  const radarH = 320;
  const topGap = 50;
  let ty = topGap;
  const secTitleH = 42;
  const secBodyPad = 6;
  const secGap = 24;
  let sectionsH = 0;
  secs.forEach(s => {
    sectionsH += secTitleH + secBodyPad + s[1].length * 33 + secGap;
  });
  const upsellH = 130;
  const H = Math.ceil(ty + titleH + nameH + tagH + kwH + radarH + sectionsH + upsellH + 40);

  canvas.width = W;
  canvas.height = H;

  // 背景渐变
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d1b33');
  bg.addColorStop(0.5, '#14294a');
  bg.addColorStop(1, '#0d1b33');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 橙色竖条
  ctx.fillStyle = '#ff8c5a';
  ctx.fillRect(padX, 40, 3, 90);

  // title
  ctx.fillStyle = '#c7d3e4';
  ctx.font = '800 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(CONFIG.title, padX + 20, 70);

  // name
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 60px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(type.name, padX, 150);

  // tagline
  ctx.fillStyle = '#ff8c5a';
  ctx.font = 'italic 600 24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(type.tagline, padX, 196);

  // keywords
  let kx = padX;
  ctx.font = '700 20px "PingFang SC","Microsoft YaHei",sans-serif';
  type.keywords.forEach(k => {
    const w = ctx.measureText(k).width + 36;
    const h = 42;
    const ky = 226;
    ctx.beginPath();
    const rr = 21;
    ctx.moveTo(kx + rr, ky);
    ctx.lineTo(kx + w - rr, ky);
    ctx.arcTo(kx + w, ky, kx + w, ky + rr, rr);
    ctx.lineTo(kx + w, ky + h - rr);
    ctx.arcTo(kx + w, ky + h, kx + w - rr, ky + h, rr);
    ctx.lineTo(kx + rr, ky + h);
    ctx.arcTo(kx, ky + h, kx, ky + h - rr, rr);
    ctx.lineTo(kx, ky + rr);
    ctx.arcTo(kx, ky, kx + rr, ky, rr);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,140,90,.14)';
    ctx.fill();
    ctx.strokeStyle = '#ff8c5a';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#ff8c5a';
    ctx.textAlign = 'center';
    ctx.fillText(k, kx + w / 2, ky + 28);
    ctx.textAlign = 'left';
    kx += w + 14;
  });

  // 雷达图
  const radarR = 110;
  const rc = [W / 2, 300 + radarR * 0.55];
  const uShow = rates.map(v => Math.round(v / 100 * 100));
  drawRadar(ctx, rc[0], rc[1], radarR, uShow, type.dims);

  // 分节
  ty = 300 + radarR * 1.6 + 20;
  secs.forEach(s => {
    ty = drawSec(ctx, ty, s[0], s[1]);
  });

  // 结尾 upsell + 署名
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff8c5a';
  ctx.font = 'italic 600 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(CONFIG.upsellText, W / 2, ty);
  ty += 40;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(CONFIG.upsellBtn + '  →', W / 2, ty);
  ty += 44;
  ctx.fillStyle = '#c7d3e4';
  ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('玄策观人 · 小红书号 4950383218', W / 2, ty);
  ty += 28;
  ctx.fillStyle = '#78859b';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('非职业测评 · 非预测 · 结果仅供娱乐', W / 2, ty);
}

  curQ = 0;
  answers = new Array(CONFIG.questions.length);
  userRaw = new Array(dimCount).fill(0);
  renderQuestion();
  show('screen-quiz');
});
$('btnBack').addEventListener('click', () => {
  show('screen-gender');
});
</script>
