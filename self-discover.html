<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认清真实的自己</title>
<style>
  :root{
    --bg:#f5efe6; --ink:#2a1a1a; --gold:#b8860b; --gold2:#d4af37;
    --card:#fffdf8; --muted:#8a7d6d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh;
    background-image:radial-gradient(circle at 20% 10%, rgba(184,134,11,.06), transparent 40%),
                     radial-gradient(circle at 80% 90%, rgba(184,134,11,.08), transparent 40%);
  }
  .screen{display:none; min-height:100vh; padding:24px 20px 48px;}
  .screen.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .wrap{max-width:520px; margin:0 auto;}

  .brand{text-align:center; color:var(--muted); font-size:12px; letter-spacing:2px; margin:10px 0 4px;}
  .title{text-align:center; font-size:24px; font-weight:800; letter-spacing:1px; line-height:1.45; margin:6px 0 2px;}
  .subtitle{text-align:center; color:var(--muted); font-size:14px; margin-bottom:22px;}
  .hook{text-align:center; font-size:14px; line-height:1.8; color:#6b5d4d; margin:0 0 18px;}
  .rule-note{text-align:center; color:#c9bdaa; font-size:11px; margin-top:20px;}

  .card{background:var(--card); border-radius:18px; padding:28px 22px; box-shadow:0 8px 30px rgba(42,26,26,.08);}

  .btn{display:block; width:100%; padding:15px; border:none; border-radius:14px; font-size:17px; font-weight:700;
       cursor:pointer; text-align:center; transition:transform .08s ease, opacity .15s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#fff;}
  .btn-ghost{background:#f2ece2; color:var(--ink);}
  .btn+.btn{margin-top:12px;}

  .code-input{width:100%; padding:16px; font-size:26px; text-align:center; letter-spacing:12px; border:2px solid #e6dccb;
    border-radius:14px; outline:none; background:#fff; color:var(--ink); margin-bottom:16px;}
  .code-input:focus{border-color:var(--gold);}
  .err{color:#c0392b; font-size:13px; text-align:center; min-height:18px; margin-bottom:8px;}

  .gender-row{display:flex; gap:12px; margin-top:8px;}
  .gender-row .btn{flex:1; padding:18px 8px; font-size:16px;}

  .progress-bar{height:6px; background:#efe6d8; border-radius:3px; overflow:hidden; margin:6px 0 22px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2)); transition:width .3s ease;}
  .q-count{text-align:center; color:var(--muted); font-size:13px; margin-bottom:16px;}
  .q-text{font-size:20px; font-weight:700; line-height:1.5; margin-bottom:24px; text-align:center;}
  .opt{display:block; width:100%; text-align:left; padding:15px 16px; margin-bottom:12px; border:1.5px solid #e6dccb;
    border-radius:14px; background:#fff; font-size:16px; line-height:1.45; cursor:pointer; transition:all .15s ease;}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--gold); background:#fbf3df;}
  .opt .tag{color:var(--gold); font-weight:800; margin-right:8px;}
  .quiz-nav{display:flex; gap:12px; margin-top:10px;}
  .quiz-nav .btn{flex:1;}

  .result-head{text-align:center; margin-bottom:8px;}
  .result-head .fig-name{font-size:34px; font-weight:900; letter-spacing:2px; margin:6px 0 2px;}
  .result-head .fig-tag{color:var(--gold); font-style:italic; font-size:15px; margin-bottom:4px;}
  .result-head .dim-tags{margin:10px 0 2px;}
  .result-head .dim-tags span{display:inline-block; background:#fbf3df; color:var(--gold); border:1px solid #ecd9a8;
    border-radius:20px; padding:4px 12px; font-size:13px; margin:3px 4px;}

  .canvas-wrap{margin:18px auto 8px; text-align:center;}
  canvas{max-width:100%; height:auto; border-radius:16px; box-shadow:0 10px 34px rgba(42,26,26,.14);}
  .save-tip{text-align:center; color:var(--muted); font-size:12px; margin:10px 0 16px;}
  .back-link{display:block; text-align:center; color:var(--gold); font-size:14px; margin-top:18px; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>

<!-- ============ 门禁屏 ============ -->
<div class="screen active" id="screen-gate">
  <div class="wrap">
    <div class="brand">性格原型 · 仅供娱乐</div>
    <div class="title">认清真实的自己</div>
    <div class="subtitle">你的答案，藏着你从没认真看过的自己</div>
    <div class="card">
      <div class="hook">你以为很了解自己，其实那些下意识的选择、改不掉的习惯、反复出现的纠结，早就悄悄勾勒出了你的性格底色。<br>回答这些问题，你会第一次，真正看见那个藏起来的自己。</div>
      <input class="code-input" id="codeInput" inputmode="numeric" maxlength="8" placeholder="输入访问码" autocomplete="off">
      <div class="err" id="codeErr"></div>
      <button class="btn btn-primary" onclick="enterTest()">开始测试</button>
    </div>
    <div class="rule-note">非心理测评 · 非算命 · 结果仅供娱乐</div>
  </div>
</div>

<!-- ============ 性别筛选屏 ============ -->
<div class="screen" id="screen-gender">
  <div class="wrap">
    <div class="brand">性格原型 · 仅供娱乐</div>
    <div class="title">你是谁</div>
    <div class="subtitle">选一组，结果更贴合你</div>
    <div class="card">
      <div class="gender-row">
        <button class="btn btn-ghost" onclick="setGender('f')">我是女生</button>
        <button class="btn btn-ghost" onclick="setGender('m')">我是男生</button>
        <button class="btn btn-ghost" onclick="setGender('all')">男女都行</button>
      </div>
    </div>
    <div class="rule-note">性别只用于筛选结果池，不影响计分</div>
  </div>
</div>

<!-- ============ 答题屏 ============ -->
<div class="screen" id="screen-quiz">
  <div class="wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-count" id="qCount"></div>
    <div class="q-text" id="qText"></div>
    <div id="qOptions"></div>
    <div class="quiz-nav">
      <button class="btn btn-ghost" id="btnPrev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">下一题</button>
    </div>
  </div>
</div>

<!-- ============ 结果屏 ============ -->
<div class="screen" id="screen-result">
  <div class="wrap">
    <div class="result-head" id="resultHead"></div>
    <div class="canvas-wrap"><canvas id="resultCanvas"></canvas></div>
    <div class="save-tip">↑ 长按图片可保存到相册</div>
    <button class="btn btn-primary" onclick="saveImage()">保存结果图</button>
    <button class="btn btn-ghost" onclick="openUpsell()">解锁「性格进阶报告」</button>
    <button class="btn btn-ghost" onclick="restart()">再测一次</button>
    <div class="back-link" onclick="backToGender()">换一组重测</div>
    <div class="rule-note">非心理测评 · 非算命 · 结果仅供娱乐 · 请勿用于任何预测用途</div>
  </div>
</div>

<script>

const dims = CONFIG.dims;
const dimCount = dims.length;
let gender = 'all';
let answers = [];      // 每题选择的选项下标
let userRaw = new Array(dimCount).fill(0);
let curQ = 0;

// 每个维度在题库中出现的次数（用于归一化）
const dimFreq = new Array(dimCount).fill(0);
CONFIG.questions.forEach(q => q.opts.forEach(o => { dimFreq[o.d]++; }));

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function enterTest(){
  const v = document.getElementById('codeInput').value.trim();
  const errEl = document.getElementById('codeErr');
  const ok = (v === CONFIG.accessCode);
  if(ok){ errEl.textContent=''; show('screen-gender'); }
  else { errEl.textContent = '访问码不正确，请重试'; }
}
document.getElementById('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') enterTest(); });

function setGender(g){
  gender = g;
  answers = []; userRaw = new Array(dimCount).fill(0); curQ = 0;
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = CONFIG.questions[curQ];
  document.getElementById('qCount').textContent = `第 ${curQ+1} / ${CONFIG.questions.length} 题`;
  document.getElementById('progressFill').style.width = ((curQ)/CONFIG.questions.length*100)+'%';
  document.getElementById('qText').textContent = q.text;
  const box = document.getElementById('qOptions');
  box.innerHTML = '';
  const labels = ['A','B','C','D'];
  q.opts.forEach((o, i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answers[curQ]===i ? ' sel':'');
    b.innerHTML = `<span class="tag">${labels[i]}</span>${o.t}`;
    b.onclick = ()=>{ selectOption(i); };
    box.appendChild(b);
  });
  document.getElementById('btnPrev').style.visibility = curQ===0 ? 'hidden':'visible';
  document.getElementById('btnNext').textContent = curQ===CONFIG.questions.length-1 ? '看结果':'下一题';
}

function selectOption(i){
  const prev = answers[curQ];
  if(prev !== undefined){ userRaw[CONFIG.questions[curQ].opts[prev].d]--; }
  answers[curQ] = i;
  userRaw[CONFIG.questions[curQ].opts[i].d]++;
  renderQuestion();
}

function nextQuestion(){
  if(answers[curQ] === undefined){ return; }  // 需先选
  if(curQ < CONFIG.questions.length-1){
    curQ++;
    document.getElementById('progressFill').style.width = ((curQ)/CONFIG.questions.length*100)+'%';
    renderQuestion();
  } else {
    computeResult();
  }
}

function prevQuestion(){
  if(curQ > 0){ curQ--; renderQuestion(); }
}

function normalizedUser(){
  // 每维归一化到 0-100（按该维出现次数）
  return dims.map((_, i)=> Math.round( (userRaw[i] / (dimFreq[i]||1)) * 100 ));
}

function computeResult(){
  const u = normalizedUser();
  const pool = CONFIG.figures.filter(f => gender==='all' || f.gender===gender);
  let best = null, bestSim = -Infinity;
  pool.forEach(f=>{
    let dot=0, mu=0, mf=0;
    for(let i=0;i<dimCount;i++){
      dot += u[i]*f.dims[i]; mu += u[i]*u[i]; mf += f.dims[i]*f.dims[i];
    }
    const sim = dot / (Math.sqrt(mu)*Math.sqrt(mf) || 1);
    if(sim > bestSim){ bestSim = sim; best = f; }
  });
  renderResult(best, u, pool);
}

function topDims(vec, n=2){
  return vec.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v).slice(0,n).map(x=>x.i);
}

function renderResult(fig, u, pool){
  const head = document.getElementById('resultHead');
  const tags = topDims(u,3).map(i=>dims[i]).map(d=>`<span>${d}</span>`).join('');
  head.innerHTML = `
    <div class="brand">你的性格原型是</div>
    <div class="fig-name">${fig.name}</div>
    <div class="fig-tag">${fig.tagline}</div>
    <div class="dim-tags">${tags}</div>`;
  show('screen-result');
  drawCard(fig, u);
}

/* ================= 结果卡 canvas 渲染 ================= */
function wrapLines(ctx, text, maxWidth){
  const lines = []; let cur = '';
  for(const ch of text){
    if(ctx.measureText(cur+ch).width > maxWidth && cur){
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if(cur) lines.push(cur);
  return lines;
}

function drawRadar(ctx, cx, cy, r, userVec, figVec){
  const n = dimCount;
  const angle = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i, rr) => [cx + Math.cos(angle(i))*rr, cy + Math.sin(angle(i))*rr];

  ctx.strokeStyle = 'rgba(212,175,55,.25)';
  ctx.lineWidth = 1;
  for(let ring=1; ring<=3; ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){ const [x,y]=pt(i, r*ring/3); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.closePath(); ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const [x,y]=pt(i,r);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle='rgba(212,175,55,.35)'; ctx.stroke();
  }
  ctx.fillStyle = '#e8ddc2'; ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<n;i++){
    const [x,y]=pt(i, r+20);
    ctx.fillText(dims[i], x, y);
  }
  ctx.strokeStyle = '#d4af37'; ctx.setLineDash([5,4]); ctx.lineWidth=1.6;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const [x,y]=pt(i, r*figVec[i]/100); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(212,175,55,.35)'; ctx.strokeStyle = '#d4af37'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<n;i++){ const [x,y]=pt(i, r*userVec[i]/100); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawCard(fig, u){
  const W = 750;
  const padX = 48;
  const c = document.getElementById('resultCanvas');
  const ctx = c.getContext('2d');

  const measure = (text, font, maxW) => {
    ctx.font = font;
    return wrapLines(ctx, text, maxW);
  };

  const titleFont = '800 38px "PingFang SC","Microsoft YaHei",sans-serif';
  const nameFont  = '900 60px "PingFang SC","Microsoft YaHei",sans-serif';
  const tagFont   = 'italic 22px "PingFang SC","Microsoft YaHei",sans-serif';
  const secFont   = '800 27px "PingFang SC","Microsoft YaHei",sans-serif';
  const bodyFont  = '21px "PingFang SC","Microsoft YaHei",sans-serif';
  const bodyMaxW = W - padX*2;
  const bodyLH = 33;
  const secTitleH = 42;
  const secBodyPad = 6;
  const secGap = 24;

  const tagLines    = measure(fig.tagline, tagFont, W-120);
  const kws = (CONFIG.keywords && CONFIG.keywords[fig.name]) || [];
  const punch = (CONFIG.punchline && CONFIG.punchline[fig.name]) || '';
  const punchFont = 'italic 26px "PingFang SC","Microsoft YaHei",sans-serif';
  const punchLines = punch ? measure(punch, punchFont, W - padX*2 - 28) : [];
  // 能力小板块：按人物自身最强 3 维，用 dimDesc 生成三行小板块
  const figTop = topDims(fig.dims, 3);
  const facetLines = [];
  figTop.forEach(i => {
    measure('· ' + dims[i] + '：' + (CONFIG.dimDesc[dims[i]]||''), bodyFont, bodyMaxW)
      .forEach(l => facetLines.push(l));
  });

  const sections = [
    ['「 你的性格底色 」', measure(fig.portrait, bodyFont, bodyMaxW)],
    ['「 别人眼里的你 · 真正的你 」', measure(fig.alike, bodyFont, bodyMaxW)],
    ['「 能力小板块 」', facetLines],
    ['「 你不肯让人看见的那一面 」', measure(fig.life, bodyFont, bodyMaxW)],
    ['「 隐藏天赋 」', measure(CONFIG.hidden[fig.name]||'', bodyFont, bodyMaxW)],
    ['「 你的长期优势 」', measure(CONFIG.strength[fig.name]||'', bodyFont, bodyMaxW)],
    ['「 你的盲点与风险 」', measure(CONFIG.blindspot[fig.name]||'', bodyFont, bodyMaxW)],
    ['「 你这辈子最大的功课 」', measure(fig.fate, bodyFont, bodyMaxW)],
    ['「 给你的建议 」', measure(CONFIG.advice[fig.name]||'', bodyFont, bodyMaxW)],
    ['「 写在最后 」', measure(CONFIG.heal[fig.name]||'', bodyFont, bodyMaxW)],
  ];
  const lineLines = fig.lines.map(l=>measure(l, bodyFont, bodyMaxW));

  const radarR = 140;
  const radarH = radarR*2 + 60;

  // —— 先量文字高度，确定 canvas 总高 ——
  let y = 78;
  y += 46;                            // title 行
  y += 64;                            // 人物名
  y += tagLines.length*32 + 28;       // tagline
  if(kws.length){ y += 42 + 22; }     // 能量词标签
  if(punch){ y += 26 + punchLines.length*38 + 32; }  // 一句话说穿你
  const radarCy = y + radarR + 40;
  y += radarH + 26;                   // 雷达图区域
  sections.forEach(s=>{ y += secTitleH + secBodyPad + s[1].length*bodyLH + secGap; });
  y += secTitleH + 6;                 // 三句台词标题
  lineLines.forEach(ll=>{ y += ll.length*bodyLH + 6; });
  y += 76 + 130;                      // 结尾商品引导 + footer + 底部留白

  const H = Math.max(Math.ceil(y + 90), 1500);
  c.width = W; c.height = H;

  // —— 绘制 ——
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a1a'); bg.addColorStop(0.55,'#3a2420'); bg.addColorStop(1,'#2a1a1a');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(212,175,55,.9)';
  ctx.fillRect(padX, 40, 3, 90);
  ctx.fillRect(W-padX-3, 40, 3, 90);

  let ty = 78;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';

  ctx.fillStyle = '#c9bdaa'; ctx.font = titleFont;
  ctx.fillText(CONFIG.title, W/2, ty); ty += 46;

  ctx.fillStyle = '#f0e9dc'; ctx.font = nameFont;
  ctx.fillText(fig.name, W/2, ty); ty += 64;

  ctx.fillStyle = '#d4af37'; ctx.font = tagFont;
  tagLines.forEach(l=>{ ctx.fillText(l, W/2, ty); ty += 32; });
  ty += 28;

  // 能量词标签（可晒的社交标签）
  if(kws.length){
    const kwFont = '800 23px "PingFang SC","Microsoft YaHei",sans-serif';
    const kwH = 42, pad = 15, gap = 12, radius = 21;
    ctx.font = kwFont;
    const widths = kws.map(k=>ctx.measureText(k).width + pad*2);
    const totalW = widths.reduce((a,b)=>a+b,0) + gap*(kws.length-1);
    let kx = (W - totalW)/2;
    kws.forEach((k,i)=>{
      const w = widths[i];
      ctx.beginPath();
      ctx.moveTo(kx+radius, ty);
      ctx.arcTo(kx+w, ty, kx+w, ty+kwH, radius);
      ctx.arcTo(kx+w, ty+kwH, kx, ty+kwH, radius);
      ctx.arcTo(kx, ty+kwH, kx, ty, radius);
      ctx.arcTo(kx, ty, kx+w, ty, radius);
      ctx.closePath();
      ctx.fillStyle = 'rgba(212,175,55,.14)';
      ctx.fill();
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#f2e9d8'; ctx.font = kwFont;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(k, kx + w/2, ty + kwH/2 + 1);
      kx += w + gap;
    });
    ty += kwH + 22;
  }

  // 一句话，说穿你（高亮金句）
  if(punch){
    ty += 26;
    ctx.textAlign='center';
    ctx.fillStyle = '#d4af37';
    ctx.font = '22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('❝', W/2, ty - 6); ty += 4;
    ctx.fillStyle = '#f4e9d2';
    ctx.font = punchFont;
    punchLines.forEach(l=>{ ctx.fillText(l, W/2, ty); ty += 38; });
    ty += 24;
  }

  // 雷达图（用户向量按最强维度缩放到满格，突出个人峰值）
  const uShow = (()=>{ const m = Math.max(...u, 1); return u.map(v=>Math.round(v/m*100)); })();
  const rcY = ty + radarR + 40;
  drawRadar(ctx, W/2, rcY, radarR, uShow, fig.dims);
  ty = rcY + radarR + 40 + 26;

  // 分节绘制
  const drawSec = (title, linesArr) => {
    ctx.textAlign='left';
    ctx.fillStyle = '#d4af37';
    ctx.font = secFont;
    ctx.fillText(title, padX, ty); ty += secTitleH + secBodyPad;
    ctx.fillStyle = '#f0e9dc';
    ctx.font = bodyFont;
    linesArr.forEach(l=>{ ctx.fillText(l, padX, ty); ty += bodyLH; });
    ty += secGap;
  };
  sections.forEach(s=>drawSec(s[0], s[1]));

  ctx.fillStyle = '#d4af37'; ctx.font = secFont; ctx.textAlign='left';
  ctx.fillText('「 三句台词 」', padX, ty); ty += secTitleH + 6;
  ctx.fillStyle = '#f0e9dc'; ctx.font = bodyFont;
  fig.lines.forEach(l=>{
    const ls = measure(l, bodyFont, bodyMaxW);
    ls.forEach(s=>{ ctx.fillText('· ' + s, padX, ty); ty += bodyLH; });
    ty += 6;
  });

  ty += 22;
  ctx.textAlign='center';

  // —— 结尾商品引导（不点破，只说「想更进一步」）——
  ctx.fillStyle = '#d4af37'; ctx.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
  const upLines = measure(CONFIG.upsellText||'', '800 22px "PingFang SC","Microsoft YaHei",sans-serif', W - padX*2 - 16);
  upLines.forEach(l=>{ ctx.fillText(l, W/2, ty); ty += 32; });
  ty += 10;
  ctx.fillStyle = '#f0e9dc'; ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(CONFIG.upsellBtn + ' →', W/2, ty); ty += 24;

  ctx.fillStyle = '#c9bdaa'; ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('长按图片保存 · 分享给朋友测测 TA 像谁', W/2, ty);

  c.dataset.fig = fig.name;
}

function openUpsell(){
  if(CONFIG.upsellUrl){ window.open(CONFIG.upsellUrl, '_blank'); }
}

function saveImage(){
  const c = document.getElementById('resultCanvas');
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = '认清真实的自己-' + (c.dataset.fig||'结果') + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}

function restart(){
  answers = []; userRaw = new Array(dimCount).fill(0); curQ = 0;
  show('screen-quiz'); renderQuestion();
}
function backToGender(){ show('screen-gender'); }
</script>
